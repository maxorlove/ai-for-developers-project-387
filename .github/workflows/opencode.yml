name: OpenCode
run-name: "OpenCode #${{ github.event.issue.number || github.event.pull_request.number }}"

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  check-comment:
    if: >-
      github.event.comment.user.type == 'User' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (github.event.comment.body == '/oc' || startsWith(github.event.comment.body, '/oc ') ||
       github.event.comment.body == '/opencode' || startsWith(github.event.comment.body, '/opencode '))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      allowed: ${{ steps.source.outputs.allowed }}
      pr: ${{ steps.source.outputs.pr }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check pull request source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || '' }}
        run: |
          if [[ -n "$PR_NUMBER" ]]; then
            pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
            [[ $(jq -r '.head.repo.full_name' <<< "$pr") == "$GITHUB_REPOSITORY" ]] || exit 0
            echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "sha=$(jq -r '.head.sha' <<< "$pr")" >> "$GITHUB_OUTPUT"
          fi
          echo 'allowed=true' >> "$GITHUB_OUTPUT"

  opencode:
    needs: check-comment
    if: needs.check-comment.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      admitted: ${{ steps.budget.outputs.admitted }}
      started: ${{ steps.clock.outputs.started }}
      agent: ${{ steps.model.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check PR budget
        if: needs.check-comment.outputs.pr != ''
        id: budget
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.check-comment.outputs.pr }}
        run: python3 .github/scripts/pr-budget.py
      - name: Check model configuration
        if: steps.budget.outputs.admitted != 'false'
        env:
          MODEL_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: test -n "$MODEL_KEY"
      - name: Record start
        if: steps.budget.outputs.admitted != 'false'
        id: clock
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Run OpenCode
        id: model
        if: steps.budget.outputs.admitted != 'false'
        timeout-minutes: 15
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/gpt-6.2-sol
          mentions: '/opencode,/oc'
          share: 'false'

  report:
    needs: [check-comment, opencode]
    if: >-
      always() && needs.check-comment.outputs.pr != '' &&
      (needs.opencode.outputs.admitted == 'false' || needs.opencode.result != 'success')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Report without a model call
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.check-comment.outputs.pr }}
          SHA: ${{ needs.check-comment.outputs.sha }}
          ADMITTED: ${{ needs.opencode.outputs.admitted }}
          AGENT: ${{ needs.opencode.outputs.agent }}
          STARTED: ${{ needs.opencode.outputs.started }}
        run: |
          reason=infra
          if [[ "$ADMITTED" == false ]]; then
            reason=limit_exhausted
          elif [[ -n "$STARTED" && $(($(date +%s) - STARTED)) -ge 900 ]]; then
            reason=timeout
          elif [[ "$AGENT" == failure ]]; then
            reason=agent_failed
          fi
          logs="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$reason · SHA \`$SHA\` · [журнал запуска]($logs). Нужен человек."
