name: Calendar review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: calendar-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) ||
       github.event.pull_request.user.login == 'opencode-agent[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      checks: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Check trusted review policy
        id: policy
        run: |
          if [[ -f REVIEW.md && -f .github/scripts/review-context.py ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "Initial setup PR: review policy will apply after merge." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Collect review material
        if: steps.policy.outputs.available == 'true'
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/review-context.py
      - name: Review with OpenCode
        if: steps.policy.outputs.available == 'true'
        id: review
        timeout-minutes: 10
        working-directory: ${{ runner.temp }}
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          jq -n --rawfile prompt review-input.md '{model:"big-pickle", messages:[{role:"user",content:$prompt}]}' > request.json
          status=$(curl --silent --show-error --max-time 240 --output response.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $OPENCODE_API_KEY" --header 'Content-Type: application/json' \
            --data-binary @request.json https://opencode.ai/inference/openai/v1/chat/completions)
          if [[ "$status" != 200 ]]; then
            echo "OpenCode returned HTTP $status"
            jq -r '.error.code // .error.type // "inference failed"' response.json
            exit 1
          fi
          jq -er '.choices[0].message.content | strings | select(length > 0)' response.json > review.md
      - name: Publish for the reviewed head
        if: ${{ !cancelled() && steps.policy.outputs.available == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.review.outcome }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          [[ "$current" == "$HEAD_SHA" ]] || exit 0
          logs="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          file="$RUNNER_TEMP/published-review.md"
          echo "Авторевью · \`$HEAD_SHA\` · [журнал]($logs)" > "$file"
          echo >> "$file"
          if [[ "$RESULT" == success ]]; then
            cat "$RUNNER_TEMP/review.md" >> "$file"
          else
            echo "Ревью не завершено. Нужен человек." >> "$file"
          fi
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$file"
