<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Владелец календаря · Календарь звонков</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/owner.css" />
  </head>
  <body>
    <main>
      <a href="/">На главную</a>
      <h1>Владелец календаря</h1>
      <section aria-labelledby="event-types-heading">
        <h2 id="event-types-heading">Типы встреч</h2>
        <ul id="owner-event-types" hidden></ul>
        <p id="owner-catalog-status" role="status">Загружаем типы встреч…</p>
      </section>
      <form id="event-type-form">
        <label>
          Идентификатор
          <input name="id" pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="intro-30"
            title="Строчные латинские буквы и цифры, одиночный дефис между частями" required />
        </label>
        <label>
          Название
          <input name="title" required />
        </label>
        <label>
          Описание
          <textarea name="description" required></textarea>
        </label>
        <label>
          Длительность, мин.
          <input name="durationMinutes" type="number" min="1" max="540" step="1" required />
        </label>
        <button type="submit">Создать тип встречи</button>
      </form>
      <p id="event-type-status" role="status"></p>
      <section aria-labelledby="upcoming-bookings-heading">
        <h2 id="upcoming-bookings-heading">Предстоящие записи</h2>
        <p id="upcoming-bookings-status" role="status">Загружаем записи…</p>
        <ul id="upcoming-bookings-list" hidden></ul>
      </section>
    </main>
    <script type="module" src="/src/owner.ts"></script>
  </body>
</html>
